<body>

    watch the little box below change colours every second!

<script>
    const box = document.querySelector('.box');
    
    let colours = ['red-bg', 'orange-bg', 'yellow-bg', 'green-bg', 'cyan-bg', 'blue-bg', 'purple-bg', 'violet-bg', 'pink-bg'];
    let index = 0;

    setInterval(() => {
        box.classList.remove(colours[index]);
        index = (index + 1) % colours.length;
        box.classList.add(colours[index]);
    }, 1000);
</script>
